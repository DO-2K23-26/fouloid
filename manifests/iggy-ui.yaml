apiVersion: v1
kind: Namespace
metadata:
  name: fulloid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iggy
  namespace: fulloid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iggy
  template:
    metadata:
      labels:
        app: iggy
    spec:
      containers:
        - name: iggy
          image: apache/iggy:latest
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 8090
              protocol: TCP
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: IGGY_TCP_ENABLED
              value: "true"
            - name: IGGY_TCP_ADDRESS
              value: "0.0.0.0:8090"
            - name: IGGY_ROOT_USERNAME
              value: "iggy"
            - name: IGGY_ROOT_PASSWORD
              value: "iggy"
            - name: IGGY_HTTP_ENABLED
              value: "true"
            - name: IGGY_HTTP_ADDRESS
              value: "0.0.0.0:3000"
          securityContext:
            seccompProfile:
              type: Unconfined
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: iggy
  namespace: fulloid
spec:
  type: ClusterIP
  selector:
    app: iggy
  ports:
    - name: tcp
      port: 8090
      targetPort: tcp
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iggy-web-ui
  namespace: fulloid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iggy-web-ui
  template:
    metadata:
      labels:
        app: iggy-web-ui
    spec:
      containers:
        - name: iggy-web-ui
          image: apache/iggy-web-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3050
              protocol: TCP
          env:
            - name: PUBLIC_IGGY_API_URL
              value: "http://127.0.0.1:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: iggy-web-ui
  namespace: fulloid
spec:
  type: ClusterIP
  selector:
    app: iggy-web-ui
  ports:
    - name: http
      port: 3050
      targetPort: http
