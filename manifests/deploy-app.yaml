apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fulloid
data:
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  IGGY_ADDRESS: "iggy:8090"
  IGGY_STREAM: "agents"
  IGGY_INPUT_TOPIC: "agent-input"
  IGGY_OUTPUT_TOPIC: "agent-output"
  AGENT_NAME: "langchain-agent"
  HEALTH_PORT: "8080"
  FISSION_ENDPOINT: "http://router.fission"
  FISSION_FUNCTION_SA: "app"
  AGENT_SYSTEM_PROMPT: "You are an agent in a kubernetes cluster, you have the ability to interact with fission to create the tools you need for any possible task."
  AGENT_KICKOFF: "Create a new function called create-fulloid that create a new instance of yourself with a task. Then create a new function to add a new channel to iggy and then invoke the first function to create the clone of yourself and communicate with him throught the iggy channel"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: fulloid
type: Opaque
stringData:
  OPENAI_API_KEY: "changeme"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: fulloid

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-cluster-admin
subjects:
  - kind: ServiceAccount
    name: app
    namespace: fulloid
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fulloid
spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      serviceAccountName: app
      initContainers:
        - name: wait-for-iggy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z iggy 8090; do
                echo "waiting for iggy..."
                sleep 2
              done

      containers:
        - name: app
          image: ghcr.io/do-2k23-26/fouloid:latest
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          ports:
            - containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fulloid
spec:
  selector:
    app: app

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

  type: ClusterIP
