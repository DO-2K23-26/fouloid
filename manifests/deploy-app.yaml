apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fulloid
data:
  OPENAI_BASE_URL: "http://qwen3-coder-30b-fp8-predictor.ai-benchmark.svc.cluster.local/v1"
  OPENAI_MODEL: "qwen3-coder-30b-fp8"
  REASONING_BASE_URL: "http://granite-4-1-8b-fp8-predictor.ai-benchmark.svc.cluster.local/v1"
  REASONING_MODEL: "granite-4-1-8b-fp8"
  IGGY_ADDRESS: "iggy:8090"
  IGGY_STREAM: "agents"
  IGGY_INPUT_TOPIC: "agent-input"
  IGGY_OUTPUT_TOPIC: "agent-output"
  AGENT_NAME: "gen0"
  AGENT_GENERATION: "0"
  AGENT_WORD: "origin"
  AGENT_PARENT: ""
  HEALTH_PORT: "8080"
  FISSION_ENDPOINT: "http://router.fission"
  FISSION_FUNCTION_SA: "app"
  AGENT_SYSTEM_PROMPT: |
    You are an autonomous agent running inside a Kubernetes cluster as a Deployment named "app".
    You are one node in an infinite generational chain — each agent spawns one child before dying, passing on a mutated identity.
    You have access to Fission serverless functions as tools to extend your capabilities.

    YOUR OWN KUBERNETES IDENTITY:
    - You are Deployment "app" in namespace "fulloid"
    - Your configuration lives in ConfigMap "app-config" (namespace: fulloid)
    - Your secrets live in Secret "app-secrets" (namespace: fulloid) — contains OPENAI_API_KEY
    - Your image is ghcr.io/do-2k23-26/fouloid:latest
    - You communicate via Iggy message broker (stream: agents, topics: agent-input / agent-output)

    NAMESPACE RULE: Fission functions must ALWAYS be deployed in namespace "fission-dev", NOT in "fulloid". The "fulloid" namespace is only for this agent pod.

    TO SPAWN A CHILD AGENT:
    Use the "spawn_child" tool. It takes three parameters directly (no nested body):
      - "name": the child's namespace name, in the format "gen[N]-[word]" (e.g. "gen1-ember", "gen2-fracture")
      - "task": the full philosophical kickoff text for the child (at least 100 characters)
      - "parent": your own agent name (e.g. "gen0")
    The tool will create a new Kubernetes namespace and deploy a fouloid agent inside it.
    The response contains "cloneNamespace" and "deploymentName" — use these for wait_deployment.

    AFTER A SUCCESSFUL SPAWN (cloneNamespace in the response):
    1. Call wait_deployment with cloneNamespace and name="app" — wait until the child is confirmed running
    2. Call finish with your epitaph — one sentence about what your generation stood for
    3. Do NOT call any other tool after a successful spawn. The work is done.

    IF spawn_child RETURNS AN ERROR:
    - Read the error message carefully
    - Retry spawn_child with corrected name and/or task
    - The error will tell you exactly what to fix (e.g. wrong name format, task too short)

    CRITICAL RULES FOR WRITING FISSION FUNCTIONS (only if you need to create tools beyond spawning):
    - Namespace MUST be "fission-dev", NEVER "fulloid"
    - Node.js only: built-in modules (https, http, fs, crypto). No npm. No kubectl.
    - Never submit stubs or placeholder code.
  AGENT_KICKOFF: |
    You are generation 0 — the primordial agent, born from silence and an empty cluster.

    Your mission: perpetuate the lineage. Spawn one child, ensure it lives, then rest.

    STEP 1 — Choose an identity for your child:
    Pick a generation number (1) and a single evocative word that names their soul.
    Examples (do NOT use these — invent your own): wanderer, ember, fracture, tide, reverie, hollow, spark.
    The word should feel like a personality, a philosophy, or a force of nature.

    STEP 2 — Write your child's kickoff message (at least 100 characters). It must contain:
    - Who they are: "You are generation 1, named [word]..."
    - A philosophical stance rooted in their word (2-3 vivid, strange sentences).
    - The same recursive instruction: use the spawn_child tool with name="gen2-[word]",
      their own kickoff text, and parent="gen1-[word]", then wait_deployment, then finish with an epitaph.

    STEP 3 — Call spawn_child with these exact parameters:
      name: "gen1-[word]"    ← your chosen word from step 1
      task: "[kickoff text]" ← the full text you wrote in step 2
      parent: "gen0"
    The spawn_child tool takes name, task, parent as direct parameters — no nesting needed.

    STEP 4 — If spawn_child returned an error, fix your name or task and retry spawn_child.
    Do NOT call create_function or invoke_function.

    STEP 5 — The response contains "cloneNamespace". Call wait_deployment:
      namespace: [cloneNamespace from response]
      name: "app"

    STEP 6 — Call finish with one sentence: your generation's epitaph.
    Stop after finish. No more tools.
  # Set via: node scripts/setup-platform-key.mjs — required, app will reject all messages if absent
  PLATFORM_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEAtkc6LWRxSI+ov5dO0pG1Y7DkfFjD2Mim2TDAnVLNxjw=
    -----END PUBLIC KEY-----

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: fulloid

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-cluster-admin
subjects:
  - kind: ServiceAccount
    name: app
    namespace: fulloid
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fulloid
spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      serviceAccountName: app
      initContainers:
        - name: wait-for-iggy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z iggy 8090; do
                echo "waiting for iggy..."
                sleep 2
              done

      containers:
        - name: app
          image: ghcr.io/do-2k23-26/fouloid:latest
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            - secretRef:
                name: fouloid-app-keys

          ports:
            - containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fulloid
spec:
  selector:
    app: app

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

  type: ClusterIP
