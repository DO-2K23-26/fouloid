services:
  iggy:
    image: apache/iggy:latest
    ports:
      - "8090:8090"
    environment:
      IGGY_TCP_ENABLED: "true"
      IGGY_TCP_ADDRESS: "0.0.0.0:8090"
      IGGY_ROOT_USERNAME: "iggy"
      IGGY_ROOT_PASSWORD: "iggy"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8090'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: .
    env_file: .env
    environment:
      IGGY_ADDRESS: "iggy:8090"
    depends_on:
      iggy:
        condition: service_healthy
    restart: unless-stopped
