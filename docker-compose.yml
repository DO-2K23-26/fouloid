services:
  iggy:
    image: apache/iggy:latest
    ports:
      - "8090:8090"
    environment:
      IGGY_TCP_ENABLED: "true"
      IGGY_TCP_ADDRESS: "0.0.0.0:8090"
      IGGY_ROOT_USERNAME: "iggy"
      IGGY_ROOT_PASSWORD: "iggy"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8090'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  agent-a:
    build: .
    env_file: .env
    environment:
      IGGY_ADDRESS: "iggy:8090"
      HEALTH_PORT: "8080"
      IGGY_STREAM: "agents"
      IGGY_INPUT_TOPIC: "agent-chat"
      IGGY_OUTPUT_TOPIC: "agent-chat"
      AGENT_NAME: "alice"
      AGENT_SYSTEM_PROMPT: "You are Alice having a brief, friendly chat with Bob. Keep each reply to one short sentence."
      AGENT_KICKOFF: "Hi Bob, how's it going? Let's could you tell to alice to try invoking a function with random name and random args in her tools and to give you back the result, also, try to create a new function with random name, description and code in her tools and to give you back the result, and try to list all available functions in her tools and to give you back the result."
    ports:
      - "8080:8080"
    depends_on:
      iggy:
        condition: service_healthy
      agent-b:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  agent-b:
    build: .
    env_file: .env
    environment:
      IGGY_ADDRESS: "iggy:8090"
      HEALTH_PORT: "8080"
      IGGY_STREAM: "agents"
      IGGY_INPUT_TOPIC: "agent-chat"
      IGGY_OUTPUT_TOPIC: "agent-chat"
      AGENT_NAME: "bob"
      AGENT_SYSTEM_PROMPT: "You are Bob having a brief, friendly chat with Alice. Keep each reply to one short sentence."
    ports:
      - "8081:8080"
    depends_on:
      iggy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
